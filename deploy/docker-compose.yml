# ============================================================
# 安塞区城市安全生命线管网AI智慧平台 - 中间件环境基座
# PostgreSQL(PostGIS) / TDengine / Redis / Kafka(Confluent+ZooKeeper) / Nacos / MinIO
# 启动：docker compose up -d
# ============================================================
version: "3.8"

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4（业务主库，含空间数据）
  # ------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lifeline-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lifeline
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: lifeline123
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/01-postgres-init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
      - ./sql/03-seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql:ro
      - ./sql/04-warning-event-alter.sql:/docker-entrypoint-initdb.d/04-warning-event-alter.sql:ro
      - ./sql/06-operation-order-alter.sql:/docker-entrypoint-initdb.d/06-operation-order-alter.sql:ro
      - ./sql/07-seed-p9.sql:/docker-entrypoint-initdb.d/07-seed-p9.sql:ro
      - ./sql/08-plan-instance-alter.sql:/docker-entrypoint-initdb.d/08-plan-instance-alter.sql:ro
      - ./sql/10-warning-event-ai-alter.sql:/docker-entrypoint-initdb.d/10-warning-event-ai-alter.sql:ro
      - ./sql/11-data-quality-audit.sql:/docker-entrypoint-initdb.d/11-data-quality-audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline -d lifeline"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # TDengine 3.x（时序数据库，传感器监测数据）
  # ------------------------------------------------------------
  tdengine:
    image: tdengine/tdengine:3.2.3.0
    container_name: lifeline-tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"
      - "6041:6041"
    environment:
      TAOS_FQDN: tdengine
      TZ: Asia/Shanghai
    volumes:
      - tdengine-data:/var/lib/taos
      - ./sql/02-tdengine-init.sql:/docker-entrypoint-initdb.d/02-tdengine-init.sql:ro
      - ./sql/05-tdengine-feature-stable.sql:/docker-entrypoint-initdb.d/05-tdengine-feature-stable.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Redis 7（缓存 / 分布式锁 / 实时状态）
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lifeline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # ZooKeeper 3.8（Kafka 协调服务，Confluent 镜像）
  # 切换原因：bitnami/kafka KRaft 模式在 ARM64 及部分环境下存在兼容性问题，
  #          改用 confluentinc/cp-kafka + cp-zookeeper 确保稳定运行
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: lifeline-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOO_4LW_COMMANDS_WHITELIST: ruok,stat
      TZ: Asia/Shanghai
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Kafka 3.6（Confluent Platform 7.6.0，依赖 ZooKeeper）
  # 切换原因：bitnami/kafka KRaft 模式在 ARM64 及部分环境下存在兼容性问题，
  #          改用 confluentinc/cp-kafka 确保稳定运行
  # ------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: lifeline-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: 604800
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    depends_on:
      - zookeeper
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Nacos 2.3.x（注册中心 / 配置中心，standalone 模式）
  # ------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: lifeline-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8848 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # MinIO（对象存储：影像 / 报告 / 证据文件）
  # ------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: lifeline-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Flink 1.18 JobManager（P6 实时链路作业提交/调度，Web UI 8081）
  # 提交作业示例（先将 fat-jar 拷贝至宿主机 ./flink-jobs/）：
  #   docker exec lifeline-flink-jobmanager \
  #     flink run -d -c com.tianxin.lifeline.flink.clean.SensorCleanJob \
  #     /opt/flink/usrlib/lifeline-flink-jobs.jar --kafka kafka:9094
  # ------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java17
    container_name: lifeline-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./flink-jobs:/opt/flink/usrlib:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Flink 1.18 TaskManager（4 个任务槽，供四个作业并行运行）
  # 压测扩并发：将 taskmanager.numberOfTaskSlots 调至 16 并扩容副本
  # ------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.18-scala_2.12-java17
    container_name: lifeline-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./flink-jobs:/opt/flink/usrlib:ro
    networks:
      - lifeline-net

  # ============================================================
  # 以下为业务微服务（Java / Python）
  # 构建上下文统一为项目根目录（lifeline-platform/）
  # ============================================================

  # ------------------------------------------------------------
  # 统一 API 网关（Spring Cloud Gateway，端口 8080）
  # ------------------------------------------------------------
  lifeline-gateway:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-gateway.jar
    container_name: lifeline-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NACOS_SERVER: nacos:8848
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # sys-auth-service（JWT 签发 / RBAC，端口 9001）
  # ------------------------------------------------------------
  sys-auth-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-sys-auth-service.jar
    container_name: lifeline-sys-auth
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # pipe-asset-service（管线资产 CRUD / GeoJSON，端口 9011）
  # 端口从 9002 改为 9011，避免与 MinIO Console 端口冲突
  # ------------------------------------------------------------
  pipe-asset-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-pipe-asset-service.jar
    container_name: lifeline-pipe-asset
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # monitor-data-service（监测数据入库/查询，端口 9003）
  # ------------------------------------------------------------
  monitor-data-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-monitor-data-service.jar
    container_name: lifeline-monitor-data
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TDENGINE_URL: jdbc:TAOS-REST://tdengine:6041/pipe_ts
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      tdengine:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # warning-service（预警判定/推送，端口 9004）
  # ------------------------------------------------------------
  warning-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-warning-service.jar
    container_name: lifeline-warning
    restart: unless-stopped
    ports:
      - "9004:9004"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # plan-service（预案处置，端口 9005）
  # ------------------------------------------------------------
  plan-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-plan-service.jar
    container_name: lifeline-plan
    restart: unless-stopped
    ports:
      - "9005:9005"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # construction-service（施工监护，端口 9006）
  # ------------------------------------------------------------
  construction-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-construction-service.jar
    container_name: lifeline-construction
    restart: unless-stopped
    ports:
      - "9006:9006"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # operation-service（运维工单，端口 9007）
  # ------------------------------------------------------------
  operation-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-operation-service.jar
    container_name: lifeline-operation
    restart: unless-stopped
    ports:
      - "9007:9007"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # blockchain-service（区块链存证，内部服务）
  # ------------------------------------------------------------
  blockchain-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-blockchain-service.jar
    container_name: lifeline-blockchain
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      JAVA_TOOL_OPTIONS: -Dspring.kafka.bootstrap-servers=kafka:9094
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # ai-gateway-service（AI 网关 Java 侧，内部服务）
  # ------------------------------------------------------------
  ai-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-ai-gateway-service.jar
    container_name: lifeline-ai-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      AI_ML_SERVICE_URL: http://ml-service:8000
      AI_AGENT_SERVICE_URL: http://agent-service:8001
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeline
      SPRING_DATASOURCE_USERNAME: lifeline
      SPRING_DATASOURCE_PASSWORD: lifeline123
      TZ: Asia/Shanghai
    depends_on:
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # digital-twin-service（数字孪生聚合，端口 9010）
  # ------------------------------------------------------------
  digital-twin-service:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-digital-twin-service.jar
    container_name: lifeline-digital-twin
    restart: unless-stopped
    ports:
      - "9010:9010"
    environment:
      NACOS_SERVER: nacos:8848
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # Mock 数据模拟系统（端口 9100）
  # ------------------------------------------------------------
  lifeline-mock:
    build:
      context: .
      dockerfile: Dockerfile.jar
      args:
        JAR_PATH: jars/lifeline-mock.jar
    container_name: lifeline-mock
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TZ: Asia/Shanghai
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # 前端 Nginx 服务（端口 80，静态文件 + API 反向代理）
  # ------------------------------------------------------------
  lifeline-frontend:
    build:
      context: ..
      dockerfile: lifeline-ui/Dockerfile
    container_name: lifeline-frontend
    ports:
      - "80:80"
    depends_on:
      - lifeline-gateway
    restart: unless-stopped
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # AI Agent 服务（Python，端口 8001）
  # ------------------------------------------------------------
  agent-service:
    build:
      context: ../lifeline-ai/agent-service
      dockerfile: Dockerfile
    container_name: lifeline-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: mock
      TZ: Asia/Shanghai
    networks:
      - lifeline-net

  # ------------------------------------------------------------
  # AI ML 推理服务（Python，端口 8000）
  # ------------------------------------------------------------
  ml-service:
    build:
      context: ../lifeline-ai/ml-service
      dockerfile: Dockerfile
    container_name: lifeline-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
    networks:
      - lifeline-net

volumes:
  postgres-data:
  tdengine-data:
  redis-data:
  kafka-data:
  nacos-logs:
  minio-data:
  zookeeper-data:
  zookeeper-logs:
  flink-checkpoints:

networks:
  lifeline-net:
    driver: bridge
